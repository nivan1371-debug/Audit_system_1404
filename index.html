<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Audit System 1404 V12.1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:tahoma;background:#f3f4f6;padding:20px}
.card{background:white;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #ccc}
button{padding:12px;border:0;border-radius:8px;background:#1f2937;color:white;width:100%;margin-top:10px;cursor:pointer}
input,select{width:100%;padding:10px;margin:8px 0}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #999;padding:8px}
.status{display:flex;gap:10px}
.box{flex:1;background:#e5e7eb;padding:15px;border-radius:10px;text-align:center}
.active{background:#86efac}
</style>
</head>
<body>

<div class="card"><h2>سامانه حسابرسی 1404 - V12.1</h2></div>

<div class="card">
<h3>پرونده جاری</h3>
<select id="device"><option>دستگاه اجرایی</option><option>شرکت دولتی</option><option>بخش خصوصی</option></select>
<input id="company" placeholder="نام دستگاه / شرکت">
<input value="سال مالی: 1404" readonly>
<input value="سال مقایسه ای: 1403" readonly>
</div>

<div class="card">
<h3>ورودی فایل</h3>
<input id="files" type="file" multiple>
<button onclick="uploadFiles()">بارگذاری فایل</button>
<p id="msg">فایلی انتخاب نشده است</p>
</div>

<div class="card">
<h3>فرآیند تبدیل</h3>
<table>
<tr><th>ورودی</th><th>خروجی</th></tr>
<tr><td>PDF / تصویر</td><td>Excel قابل ویرایش</td></tr>
<tr><td>Excel گردش حساب</td><td>کاربرگ اصلی، فرعی و سندرسی</td></tr>
<tr><td>Word</td><td>کاربرگ حسابرسی</td></tr>
</table>
<button onclick="convert()">شروع تبدیل</button>
</div>

<div class="card">
<h3>خروجی</h3>
<button onclick="alert('خروجی Excel آماده‌سازی شد')">دریافت Excel</button>
<button onclick="alert('خروجی Word آماده‌سازی شد')">دریافت Word</button>
<button onclick="alert('خروجی PDF آماده‌سازی شد')">دریافت PDF</button>
</div>

<div class="card">
<h3>وضعیت رسیدگی</h3>
<div class="status">
<div id="balance" class="box">تراز<br>آماده</div>
<div id="work" class="box">کاربرگ‌ها<br>0%</div>
<div id="control" class="box">کنترل‌ها<br>0%</div>
</div>
</div>

<script>
function uploadFiles(){
 const f=document.getElementById('files').files;
 if(f.length){
  document.getElementById('msg').innerHTML='تعداد فایل انتخاب شده: '+f.length;
  document.getElementById('balance').classList.add('active');
 }
}
function convert(){
 document.getElementById('work').innerHTML='کاربرگ‌ها<br>50%';
 document.getElementById('control').innerHTML='کنترل‌ها<br>50%';
 setTimeout(()=>{
  document.getElementById('work').innerHTML='کاربرگ‌ها<br>100%';
  document.getElementById('control').innerHTML='کنترل‌ها<br>100%';
 },1000);
}
</script>
</body>
</html>
